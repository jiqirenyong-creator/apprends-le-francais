const POS={v:"动词",n:"名词",a:"形容词",p:"名词短语",w:"动词短语"};
const pf=w=>w.f.split(" / ")[0];
const W=RAW.split("\n").filter(l=>l.includes("|")).map(l=>{const[z,f,p]=l.split("|");return{id:z+"|"+f.split(" / ")[0],z,f,p}});
const EASY=new Set(["dieu","jésus","satan","péché","nature","raison","loi","vie","justice","juste"]);
const STOP=/^(le|la|les|l|de|du|des|d|à|en|un|une|mon|ma|se|s|qqn|qch|et)$/i;
const words=f=>f.replace(/\([^)]*\)/g," ").replace(/[’']/g," ").split(/[\s,-]+/).filter(x=>x&&!STOP.test(x));
function lvl(w){const ws=words(pf(w));if(ws.length===1&&EASY.has(ws[0].toLowerCase()))return"A1";const sc=Math.max(...ws.map(x=>x.length),0)+1.5*(ws.length-1);return sc<=4?"A1":sc<=7?"A2":sc<=10?"B1":sc<=13?"B2":sc<=16?"C1":"C2"}
const MM=new Set("péché salut don enfer tempérament examen spécimen courroux fardeau calibre archange ancien pasteur sacrificateur courant antéchrist exemple modèle règlement peuple groupe règne principe ministère monde domaine sacrifice diacre étang puits plan devoir objet fils père seigneur créateur dieu satan jésus esprit saint-esprit tout-puissant éternel jugement châtiment échange éclairage commandement témoignage christianisme dragon ciel nom".split(" "));
function gender(w){
 if(!/^[np]$/.test(w.p))return null;
 let t=pf(w).replace(/^\((le|la|les|l’|mon|ma)\)\s*/i,"$1 ").replace(/\([^)]*\)/g," ").trim().toLowerCase().replace(/’/g,"'");
 let g=null,pl=false,known=false;
 let m=t.match(/^(le|un|mon|la|une|ma|les|l')\s*(.*)$/);
 if(m){const a=m[1];t=m[2];known=true;if(a==="les")pl=true;else if(/^(le|un|mon)$/.test(a))g="m";else if(/^(la|une|ma)$/.test(a))g="f"}
 const h=(t.split(/[\s-]+/)[0]||"");
 if(!g){known=false;g=MM.has(h)?"m":/teur$/.test(h)||/(ment|isme|age|eau|oir|ier)$/.test(h)?"m":/(tion|sion|xion|té|ité|ence|ance|ure|ie|ée|ude|esse|ine|ette|eur|ère|ison)$/.test(h)?"f":/e$/.test(h)?"f":"m"}
 if(/\(s\)/.test(w.f))pl=null;
 return{g,pl,inf:!known};
}
const tags=w=>{let s=`<span class="tag">${POS[w.p]}</span>`,x=gender(w);if(x)s+=`<span class="tag">${x.g==="m"?"阳性":"阴性"}·${x.pl===null?"单/复":x.pl?"复数":"单数"}${x.inf?"*":""}</span>`;return s};
const $=i=>document.getElementById(i);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ");
const strip=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const art=s=>s.replace(/^(le |la |l'|les |un |une |mon |ma )/,"");
const alts=f=>f.split(" / ").flatMap(a=>[a,a.replace(/\s*\([^)]*\)\s*/g," ").trim(),a.replace(/[()]/g,"")]);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
W.forEach(w=>w.lv=lvl(w));
const LV=["A1","A2","B1","B2","C1","C2"];
let S={};
const show_=id=>["home","play","end","list"].forEach(i=>$(i).classList.toggle("hidden",i!==id));
function home(){
 show_("home");const m=ld("frs_m",{}),wr=ld("frs_w",[]);
 $("home").innerHTML=`<p class="sub">当前词条共 ${W.length} 个</p>`+LV.map(k=>{const ws=W.filter(w=>w.lv===k),d=ws.filter(w=>(m[w.id]||0)>=2).length;return ws.length?`<button class="lv" data-k="${k}"><div><b>${k}</b>${ws.length} 个词条</div><span>已掌握 ${d} / ${ws.length}</span></button>`:""}).join("")+
 `<button class="lv" data-k="_all"><div><b>🔀</b>全部混合</div><span>${W.length} 条</span></button><button class="lv" data-k="_w"><div><b>📒</b>错词本</div><span>${wr.length} 条</span></button><button class="lv" data-k="_l"><div><b>🔍</b>词表查询</div><span>带阴阳性数</span></button>`;
 document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>b.dataset.k==="_l"?browse():start(b.dataset.k));
}
function browse(){
 show_("list");
 $("list").innerHTML=`<div class="top"><input class="ans" id="q" placeholder="搜索中文或法语…"><button class="btn alt" style="margin:0" id="bk">返回</button></div><div class="card" id="rs"></div>`;
 const draw=()=>{const q=norm($("q").value);const r=W.filter(w=>!q||(w.z+" "+strip(w.f)).includes(strip(q))).slice(0,80);
  $("rs").innerHTML=r.map(w=>`<div class="row"><div><b>${w.z}</b><small>${w.lv}</small></div><div style="text-align:right"><b>${w.f}</b><br>${tags(w)}</div></div>`).join("")||"没有匹配的词条";};
 $("q").oninput=draw;$("bk").onclick=home;draw();
}
function start(k){
 const m=ld("frs_m",{}),wr=ld("frs_w",[]);
 const pool=k==="_all"?W:k==="_w"?W.filter(w=>wr.includes(w.id)):W.filter(w=>w.lv===k);
 if(!pool.length){alert("错词本是空的，先去闯关吧！");return}
 const ws=sh(pool).sort((a,b)=>(m[a.id]||0)-(m[b.id]||0)).slice(0,10);
 const qs=[...sh(ws).map(w=>({w,t:"m",dir:Math.random()<.5?"z2f":"f2z"})),...sh(ws).map(w=>({w,t:"f",dir:"z2f"}))];
 S={k,qs,i:0,ok:0,wrong:[]};show_("play");next();
}
function next(){
 const x=S.qs[S.i],w=x.w,n=S.qs.length;if(x.t==="f")x.dir="z2f";
 const ask=x.dir==="z2f"?w.z:pf(w);let body;
 if(x.t==="m"){
  const key=x.dir==="z2f"?"f":"z",val=o=>key==="f"?pf(o):o.z;
  const ds=sh(W.filter(o=>o.id!==w.id&&val(o)!==val(w)&&(o.p===w.p||Math.random()<.2))).filter((o,i,a)=>a.findIndex(p=>val(p)===val(o))===i).slice(0,3);
  x.ans=val(w);body=sh([w,...ds]).map(o=>`<button class="opt" data-v="${val(o).replace(/"/g,"&quot;")}">${val(o)}</button>`).join("");
 }else{
  const f0=norm(pf(w));
  body=`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入法语…"><div class="acc">${"éèêàâçôùûîïœ".split("").map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div><small>提示：首字母 ${f0[0].toUpperCase()}，共 ${f0.replace(/[^a-zà-ÿœ]/g,"").length} 个字母</small><br><button class="btn" id="chk">检查</button>`;
 }
 $("play").innerHTML=`<div class="bar"><span>${S.k[0]==="_"?"混合":S.k} · ${x.t==="m"?"① 选择阶段":"② 填空阶段"} · 第 ${S.i+1}/${n} 题</span><span>答对 ${S.ok}</span></div><div class="track"><div class="fill" style="width:${S.i/n*100}%"></div></div>
 <div class="card"><span class="tag">${w.lv}</span><span class="tag">${x.t==="m"?"选择题":"填空题"}</span>${x.dir==="z2f"?`<span class="tag">${POS[w.p]}</span>`:tags(w)}<div class="q">${ask}</div>${body}<div id="fb"></div></div>`;
 if(x.t==="m")document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>judge(b.dataset.v===x.ans,b));
 else{
  const inp=$("ans");inp.focus();
  document.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{inp.value+=b.dataset.c;inp.focus()});
  const go=()=>{const v=inp.value;if(!v.trim())return;const A=alts(w.f);
   const ex=A.some(a=>art(norm(a))===art(norm(v))),lo=A.some(a=>art(strip(a))===art(strip(v)));
   judge(ex||lo,null,lo&&!ex?"（注意重音：应为 "+w.f+"）":"")};
  $("chk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
 }
}
function judge(ok,btn,note=""){
 const x=S.qs[S.i],w=x.w;
 if(x.t==="m")document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===x.ans)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
 else{$("ans").disabled=true;$("chk").classList.add("hidden")}
 const m=ld("frs_m",{}),wr=ld("frs_w",[]);
 if(ok){S.ok++;m[w.id]=(m[w.id]||0)+(x.t==="f"?1:0);if(m[w.id]>=2)sv("frs_w",wr.filter(i=>i!==w.id))}else{if(!S.wrong.includes(w))S.wrong.push(w);m[w.id]=0;if(!wr.includes(w.id))sv("frs_w",[...wr,w.id])}
 sv("frs_m",m);const last=S.i>=S.qs.length-1;
 $("fb").innerHTML=`<div class="fb">${ok?"✅ 正确！":"❌ 再记一下。"}${note}<br><b>${w.z}</b> = <b>${w.f}</b><br>${tags(w)}</div><button class="btn" id="nx">${last?"查看结果":"下一题"}</button>`;
 $("nx").onclick=()=>{if(last)fin();else{S.i++;next()}};
}
function fin(){
 show_("end");
 $("end").innerHTML=`<div class="card"><p class="big">${S.ok} / ${S.qs.length}</p>${S.wrong.length?"<b>需要复习：</b><ul>"+S.wrong.map(w=>`<li>${w.z} → <b>${w.f}</b> ${tags(w)}</li>`).join("")+"</ul>":"<p>🎉 全部答对！</p>"}
 <button class="btn" id="a">再来一轮</button><button class="btn alt" id="h">返回</button></div>`;
 $("a").onclick=()=>start(S.k);$("h").onclick=home;
}
home();
</script>
